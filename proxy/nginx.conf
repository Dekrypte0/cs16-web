# Reverse proxy in front of the cs16-web container (P3, see docs/PERFORMANCE.md).
#
# Why: the upstream static server (inside the pinned image) serves valve.zip
# (~206 MB) and the content-hashed bundle with NO Cache-Control / ETag, so most
# browsers re-download the whole payload on every repeat visit / hard refresh.
# We can't edit that server, but docker-compose.yml is ours — so this proxy owns
# the public port 27016, forwards to the game container internally, and injects
# proper caching headers. The WebRTC media/data path (27018) is untouched; only
# the page + the same-origin signaling WebSocket (/websocket) flow through here.

events {}

http {
    # Map the Upgrade header so the WebSocket upgrade is passed through verbatim.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 27016;

        # --- liveness probe -------------------------------------------------
        # Used by ./watchdog.sh (and by hand) to tell "the whole stack is up"
        # from "the game container is restarting". Deliberately does NOT touch
        # the upstream: it answers as long as the proxy itself is healthy.
        location = /healthz {
            access_log off;
            add_header Cache-Control "no-store" always;
            return 200 "ok\n";
        }

        # Friendly page instead of a bare nginx 502 while the game container is
        # restarting (or crashed). It reloads itself, so a player who opens the
        # link a few seconds too early lands in the game instead of in an error
        # page they would have to understand.
        # '=' with no code: the status comes from the redirected location below
        # (which returns 200), so players get a normal page, not an error.
        error_page 502 503 504 = /cs-offline.html;
        location = /cs-offline.html {
            add_header Cache-Control "no-store" always;
            default_type text/html;
            return 200 '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Counter-Strike 1.6 - starting</title><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="5"><style>html,body{height:100%;margin:0;background:rgb(13,13,13);color:rgb(242,242,242);font-family:Arial,Helvetica,sans-serif}body{display:flex;align-items:center;justify-content:center}.box{max-width:430px;padding:28px;border:1px solid rgb(246,178,101);border-radius:12px;background:rgb(22,22,22);text-align:center}h1{margin:0 0 10px;font-size:19px;color:rgb(246,178,101)}p{margin:0;font-size:13.5px;line-height:1.6;color:rgb(170,170,170)}</style></head><body><div class=box><h1>Starting the game server...</h1><p>The server is not answering yet. This page reloads itself every 5 seconds, so just leave it open.</p></div></body></html>';
        }

        # Resolve the game container by name at request time (Docker embedded DNS),
        # so this proxy survives the upstream container being recreated.
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $game "cs16-web:27016";

        # WebRTC signaling WebSocket — the make-or-break path. The client opens
        # ws(s)://<host>/websocket; the upgrade MUST pass through untouched or the
        # game never connects.
        location = /websocket {
            proxy_pass http://$game;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # Content-hashed bundle assets (JS / WASM / CSS / images): the filename
        # changes whenever the content changes, so they are safe to cache forever.
        # Covers the main-*.js bundle AND the multi-MB xash-*.wasm /
        # libref_webgl2-*.wasm modules and the hashed logo/favicon.
        location ~ "^/assets/.+-[A-Za-z0-9_-]{6,}\.(js|wasm|css|png)$" {
            proxy_pass http://$game;
            proxy_set_header Host $host;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # The big game payload. It is NOT content-hashed and its bytes change when
        # start.sh rebuilds it, so the browser must never serve a stale copy.
        # `no-cache` still STORES the body (fixing the root-cause re-download — the
        # in-image server sent no Cache-Control at all, so browsers re-fetched all
        # of it) but forces a conditional GET each load: the upstream Last-Modified
        # (which changes on rebuild) yields a cheap 304 when unchanged and a fresh
        # 200 immediately after a rebuild. A long max-age would instead serve the
        # old zip for hours after a rebuild. Stream it (buffering off) so nginx
        # doesn't spool the whole file to disk.
        location = /valve.zip {
            proxy_pass http://$game;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, no-cache" always;
        }

        # Engine extras + JSZip under /vendor/. Content-hashed filenames
        # (extras-<hash>.pk3) plus a versioned JSZip, so they never change under
        # the same name: cache them forever instead of re-downloading 1.5 MB of
        # fonts/menu textures on every visit.
        location /vendor/ {
            proxy_pass http://$game;
            proxy_set_header Host $host;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # index.html and everything else: store but always revalidate, so patched
        # client changes deploy promptly. The only WebSocket path is /websocket
        # (handled above), so no upgrade headers here — this avoids forcing
        # Connection: close on every normal request.
        location / {
            proxy_pass http://$game;
            proxy_set_header Host $host;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-cache" always;
        }
    }
}
